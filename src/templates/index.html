<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Agente Local de Productividad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2">
                    <i class="fa-solid fa-robot"></i> Mi Agente Local
                </h1>
                <p class="text-slate-400 text-sm">IA impulsada por Ollama & SQLite local</p>
            </div>
            <span class="hidden sm:block bg-indigo-950 text-indigo-300 text-xs px-3 py-1 rounded-full border border-indigo-800">
                ● Modelo: LLM Local Activo
            </span>
        </header>

        <!-- Input de Agente IA -->
        <section class="bg-slate-800 rounded-xl p-6 mb-8 border border-slate-700 shadow-xl">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-slate-200">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> ¿Qué necesitas hacer?
            </h2>
            <form id="agent-form" class="flex gap-3">
                <input type="text" id="user-input" required
                    placeholder="Ej: 'Recuérdame revisar el avance del portafolio mañana a las 4pm'" 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm">
                <button type="submit" id="submit-btn" 
                    class="bg-indigo-600 hover:bg-indigo-500 font-medium px-6 py-3 rounded-lg transition-colors flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-paper-plane"></i> Procesar
                </button>
            </form>
            <p id="status-msg" class="mt-3 text-xs text-slate-400 hidden"></p>
        </section>

        <!-- Grid de Tareas -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-200">Mis Tareas y Proyectos</h2>
                <button onclick="loadTasks()" class="text-xs text-slate-400 hover:text-indigo-400 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Actualizar
                </button>
            </div>

            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </section>
    </div>

    <script>
        async function loadTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '<p class="text-slate-500 col-span-3 text-center py-8">Cargando tareas...</p>';
            
            try {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="col-span-3 text-center py-12 border border-dashed border-slate-800 rounded-xl"><p class="text-slate-500">No hay tareas creadas aún.</p></div>';
                    return;
                }

                container.innerHTML = tasks.map(t => {
                    const statusColors = {
                        'PENDING': 'bg-amber-950 text-amber-400 border-amber-800',
                        'NOTIFIED': 'bg-blue-950 text-blue-400 border-blue-800',
                        'COMPLETED': 'bg-emerald-950 text-emerald-400 border-emerald-800'
                    };
                    
                    return `
                        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-slate-600 transition-all">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs px-2.5 py-0.5 rounded-full border ${statusColors[t.status] || 'bg-slate-700'}">
                                        ${t.status}
                                    </span>
                                    <span class="text-xs text-indigo-400 font-mono bg-indigo-950/60 px-2 py-0.5 rounded">
                                        📁 ${t.project_name || 'General'}
                                    </span>
                                </div>
                                <h3 class="font-bold text-slate-100 mb-1">${t.title}</h3>
                                ${t.description ? `<p class="text-slate-400 text-xs mb-3">${t.description}</p>` : ''}
                            </div>
                            
                            <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center text-xs text-slate-400">
                                <span><i class="fa-regular fa-clock mr-1"></i> ${t.due_date || 'Sin fecha'}</span>
                                <div class="flex gap-2">
                                    ${t.status !== 'COMPLETED' ? `
                                        <button onclick="completeTask(${t.id})" class="hover:text-emerald-400 p-1" title="Completar">
                                            <i class="fa-solid fa-check"></i>
                                        </button>
                                    ` : ''}
                                    <button onclick="deleteTask(${t.id})" class="hover:text-rose-400 p-1" title="Eliminar">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="text-rose-400 col-span-3 text-center">Error al cargar tareas.</p>';
            }
        }

        document.getElementById('agent-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status-msg');
            
            const prompt = input.value.trim();
            if (!prompt) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Procesando...';
            status.classList.remove('hidden', 'text-rose-400');
            status.classList.add('text-amber-400');
            status.textContent = '🤖 El agente local está analizando la intención con Ollama...';

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt })
                });
                
                const data = await res.json();
                if (res.ok) {
                    status.classList.remove('text-amber-400');
                    status.classList.add('text-emerald-400');
                    status.textContent = '✅ Tarea creada y guardada con éxito.';
                    input.value = '';
                    loadTasks();
                } else {
                    throw new Error(data.detail || 'Error en el procesamiento');
                }
            } catch (err) {
                status.classList.remove('text-amber-400');
                status.classList.add('text-rose-400');
                status.textContent = `❌ ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Procesar';
            }
        });

        async function completeTask(id) {
            await fetch(`/api/tasks/${id}/complete`, { method: 'PUT' });
            loadTasks();
        }

        async function deleteTask(id) {
            if (confirm('¿Eliminar esta tarea?')) {
                await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                loadTasks();
            }
        }

        // Cargar tareas al iniciar
        loadTasks();
    </script>
</body>
</html>
